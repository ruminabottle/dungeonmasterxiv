# The relay's deployment: read-only root and no volume (it stores nothing), TLS terminated in the container.

services:
  relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        GIT_COMMIT: ${GIT_COMMIT:-unknown}
    restart: unless-stopped

    # 443 on the host maps straight to the relay, with no proxy in between.
    ports:
      - "443:443"

    environment:
      DMX_RELAY_PORT: "443"
      DMX_RELAY_USE_TLS: "true"
      DMX_RELAY_CERT_PATH: /run/secrets/relay-certificate
      DMX_RELAY_CERT_PASSWORD: ${DMX_RELAY_CERT_PASSWORD:-}
      # Keepalive left unset so it follows TransportContract; the reap timeout derives from it and has no setting.

    # The operator supplies the first certificate file; deploy/relay-renew-cert.sh renews it in place, and the
    # relay reloads it without a restart (README, "Certificate renewal"). The VM and DNS are outside this repository.
    secrets:
      - relay-certificate

    read_only: true
    tmpfs:
      - /tmp:size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

    # No volumes: the relay stores nothing.

secrets:
  relay-certificate:
    file: ./relay-certificate.pfx
